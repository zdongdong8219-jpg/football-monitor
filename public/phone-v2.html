<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>足球图片</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f1;color:#173d32;font-family:"Microsoft YaHei",sans-serif}main{max-width:720px;margin:auto;padding:12px}h1{margin:4px 0 6px;font-size:22px}.tip{margin:0 0 12px;color:#5d726a;font-size:13px}.card{margin-bottom:14px;padding:10px;background:#fff;border:1px solid #aac9bd;border-radius:6px}.head{display:flex;justify-content:space-between;margin-bottom:8px}.head strong{font-size:17px}.head span{font-size:12px;color:#667b73}img{display:block;width:100%;height:auto;border:1px solid #b7cec5;background:#e5eeeb}button{display:block;width:100%;margin-top:9px;padding:13px 8px;border:0;border-radius:5px;background:#197751;color:#fff;font-size:16px;font-weight:700}button:disabled{background:#829b92}#status{padding:30px;text-align:center}
</style></head><body><main><h1>足球四图</h1><p class="tip">点击绿色按钮，直接复制对应图片。</p><div id="cards"><div id="status">正在加载…</div></div></main><script>
(async()=>{const cards=document.getElementById('cards'),version='20261107-early-core20-s1',rawBase='cards/';try{const [today,review]=await Promise.all([fetch(`data/latest.json?v=${version}`,{cache:'no-store'}).then(r=>r.json()),fetch(`data/review-latest.json?v=${version}`,{cache:'no-store'}).then(r=>r.json())]);document.querySelector('.tip').textContent='点击绿色按钮复制对应图片。'+((today.supplement?.publishedAt||today.revision?.publishedAt||today.publishedAt)?' 实际提交：'+new Date((today.supplement?.publishedAt||today.revision?.publishedAt||today.publishedAt)).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'')+'；'+(today.batchLabel||'')+'；赛前原图留档。';const detail=document.createElement('a');detail.href='info-2026-11-07-early.html';detail.textContent=' 查看逐场概率、依据与风险';document.querySelector('.tip').append(detail);const displayOverrides={'2026-11-05-core30-r2-tracking.png':'2026-11-05-core30-r2-tracking-display-settled.png','2026-11-04-final-tracking.png':'2026-11-04-final-tracking-display-settled.png','2026-11-03-core30-r2-tracking.png':'2026-11-03-core30-r2-tracking-display-settled.png','2026-11-03-review-tracking.png':'2026-11-03-review-tracking-display-settled.png'};const reviewDate=review.completed?review.date:'2026-11-05';const items=[['推荐扫盘',today.date,today.imageFiles?.scan||`${today.date}-final-scan.png`],['今日跟踪',today.date,today.imageFiles?.tracking||`${today.date}-final-tracking.png`],['复盘扫盘',reviewDate,`${reviewDate}-review-scan.png`],['复盘跟踪',reviewDate,`${reviewDate}-review-tracking.png`]];cards.textContent='';for(const [title,date,sourceFile] of items){const file=displayOverrides[sourceFile]||sourceFile;const box=document.createElement('section');box.className='card';const preview=`${rawBase}${file.replace('.png','-preview.jpg')}?v=${version}`,full=`${rawBase}${file}?v=${version}`;box.innerHTML='<div class="head"><strong></strong><span></span></div><img loading="lazy" decoding="async"><button type="button">点击复制图片</button>';box.querySelector('strong').textContent=title;box.querySelector('span').textContent=date;const img=box.querySelector('img'),button=box.querySelector('button');img.alt=`${date} ${title}`;img.src=preview;button.dataset.copySrc=full;button.onclick=async()=>{const text=button.textContent,url=new URL(button.dataset.copySrc,location.href);url.searchParams.set('copy',String(Date.now()));button.dataset.copyState='copying';button.textContent='正在复制高清图…';button.disabled=true;try{if(!navigator.clipboard?.write||!window.ClipboardItem)throw Error('clipboard-image-unsupported');const pngPromise=fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('image-fetch-failed');return r.blob()}).then(async b=>b.type==='image/png'?b:new Blob([await b.arrayBuffer()],{type:'image/png'}));await navigator.clipboard.write([new ClipboardItem({'image/png':pngPromise})]);button.dataset.copyState='success';button.textContent='✓ 已复制高清图'}catch(e){button.dataset.copyState='failed';button.textContent='复制失败，请检查浏览器图片权限';button.title=e?.message||'copy failed'}setTimeout(()=>{button.disabled=false;button.textContent=text},3000)};cards.append(box)}}catch{document.getElementById('status').textContent='加载失败，请刷新';}})();
</script><script>
const refreshImages=()=>document.querySelectorAll('img:not([data-fresh])').forEach(img=>{img.dataset.fresh='1';const url=new URL(img.src);url.searchParams.set('v','20261107-early-core20-s1');img.src=url});
new MutationObserver(refreshImages).observe(document.getElementById('cards'),{childList:true,subtree:true});refreshImages();
</script><aside role="alert" style="max-width:696px;margin:12px auto;padding:14px;border:2px solid #a52925;background:#fff0e8;color:#791e1a"><strong>11月7日早场：分析证据未达到核心准入，紧急发布流程违规</strong><p>001—004旧分析全部作废重审，当前推荐资格撤销。下方早场图片仅为历史原票，不是当前有效推荐；赔率、发布时间和跟踪保留，按原票复盘。</p><p>未收到完整新资料包，四场均未通过全面重审，无新2.0/3.0。001、002已到13:00开赛时点，不得加入新票。003、004因证据缺口停止核心准入。</p><a href="admission-incident-2026-11-07.html">查看事故及重审记录</a></aside><script>document.querySelector('main').prepend(document.querySelector('aside[role="alert"]'));</script></body></html>
