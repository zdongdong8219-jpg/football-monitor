<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>足球图片</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f1;color:#173d32;font-family:"Microsoft YaHei",sans-serif}main{max-width:720px;margin:auto;padding:12px}h1{margin:4px 0 6px;font-size:22px}.tip{margin:0 0 12px;color:#5d726a;font-size:13px}.card{margin-bottom:14px;padding:10px;background:#fff;border:1px solid #aac9bd;border-radius:6px}.head{display:flex;justify-content:space-between;margin-bottom:8px}.head strong{font-size:17px}.head span{font-size:12px;color:#667b73}img{display:block;width:100%;height:auto;border:1px solid #b7cec5;background:#e5eeeb}button{display:block;width:100%;margin-top:9px;padding:13px 8px;border:0;border-radius:5px;background:#197751;color:#fff;font-size:16px;font-weight:700}button:disabled{background:#829b92}#status{padding:30px;text-align:center}
</style></head><body><main><h1>足球四图</h1><p class="tip">点击绿色按钮，直接复制对应图片。</p><div id="cards"><div id="status">正在加载…</div></div></main><script>
(async()=>{const cards=document.getElementById('cards'),version='20261030-reviewfix2';try{const [today,review]=await Promise.all([fetch(`data/latest.json?v=${version}`,{cache:'no-store'}).then(r=>r.json()),fetch(`data/review-latest.json?v=${version}`,{cache:'no-store'}).then(r=>r.json())]);const items=[['推荐扫盘',today.date,`${today.date}-final-scan.png`],['今日跟踪',today.date,`${today.date}-final-tracking.png`],['复盘扫盘',review.date,`${review.date}-review-scan.png`],['复盘跟踪',review.date,`${review.date}-review-tracking.png`]];cards.textContent='';for(const [title,date,file] of items){const box=document.createElement('section');box.className='card';const preview=`cards/${file.replace('.png','-preview.jpg')}?v=${version}`,full=`cards/${file}?v=${version}`;box.innerHTML='<div class="head"><strong></strong><span></span></div><img loading="lazy" decoding="async"><button>点击复制图片</button>';box.querySelector('strong').textContent=title;box.querySelector('span').textContent=date;const img=box.querySelector('img'),button=box.querySelector('button');img.alt=`${date} ${title}`;img.src=preview;button.onclick=async()=>{const text=button.textContent;button.textContent='正在复制高清图…';button.disabled=true;try{if(!navigator.clipboard?.write||!window.ClipboardItem)throw Error();const response=await fetch(full+'?copy='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error();const source=await response.blob();const png=source.type==='image/png'?source:new Blob([await source.arrayBuffer()],{type:'image/png'});await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);button.textContent='✓ 已复制高清图'}catch{button.textContent='复制失败，请重试'}setTimeout(()=>{button.disabled=false;button.textContent=text},2500)};cards.append(box)}}catch{document.getElementById('status').textContent='加载失败，请刷新';}})();
</script><script>
const refreshImages=()=>document.querySelectorAll('img:not([data-fresh])').forEach(img=>{img.dataset.fresh='1';const url=new URL(img.src);url.searchParams.set('v','20261030-final');img.src=url});
new MutationObserver(refreshImages).observe(document.getElementById('cards'),{childList:true,subtree:true});refreshImages();
</script></body></html>
