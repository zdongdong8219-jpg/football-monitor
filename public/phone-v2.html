(async()=>{const cards=document.getElementById('cards'),version='20261110-wording-v2',rawBase='cards/';try{const [today,review]=await Promise.all([fetch(`data/latest.json?v=${version}`,{cache:'no-store'}).then(r=>r.json()),fetch(`data/review-latest.json?v=${version}`,{cache:'no-store'}).then(r=>r.json())]);document.querySelector('.tip').textContent='点击绿色按钮复制对应图片。'+((today.revision?.publishedAt||today.finalPublication?.publishedAt||today.supplement?.publishedAt||today.revision?.publishedAt||today.publishedAt)?' 实际提交：'+new Date((today.revision?.publishedAt||today.finalPublication?.publishedAt||today.supplement?.publishedAt||today.revision?.publishedAt||today.publishedAt)).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'')+'；'+(today.batchLabel||'')+'；赛前原图留档。';const detail=document.createElement('a');detail.href='info-2026-11-10-final.html';detail.textContent=' 查看今日2场六方向、缺项与组合结论';document.querySelector('.tip').append(detail);const ranks=document.createElement('ol');for(const entry of today.currentRecommendationRanking||[]){const li=document.createElement('li');li.textContent=entry.selection;ranks.append(li)}document.querySelector('.tip').after(ranks);const shared=document.createElement('p');shared.textContent='今日完整2场扫盘：无合格普通串；官方不足3场，梦想3串1合法不出。保留研究方向和反证。';ranks.after(shared);const displayOverrides={'2026-11-08-final-s1-tracking.png':'2026-11-08-final-s1-tracking-display-settled-mamlai-v2.png','2026-11-08-review-tracking.png':'2026-11-08-review-tracking-mamlai-v2.png','2026-11-05-core30-r2-tracking.png':'2026-11-05-core30-r2-tracking-display-settled.png','2026-11-04-final-tracking.png':'2026-11-04-final-tracking-display-settled.png','2026-11-03-core30-r2-tracking.png':'2026-11-03-core30-r2-tracking-display-settled.png','2026-11-03-review-tracking.png':'2026-11-03-review-tracking-display-settled.png'};const reviewDate=(review.completed||review.reviewReady)?review.date:'2026-11-05';const items=[['推荐扫盘',today.date,today.imageFiles?.scan||`${today.date}-final-scan.png`],['今日跟踪',today.date,today.imageFiles?.tracking||`${today.date}-final-tracking.png`],['复盘扫盘',reviewDate,`${reviewDate}-review-scan.png`],['复盘跟踪',reviewDate,`${reviewDate}-review-tracking.png`]];cards.textContent='';for(const [title,date,sourceFile] of items){const file=displayOverrides[sourceFile]||sourceFile;const box=document.createElement('section');box.className='card';const preview=`${rawBase}${file.replace('.png','-preview.jpg')}?v=${version}`,full=`${rawBase}${file}?v=${version}`;box.innerHTML='<div class="head"><strong></strong><span></span></div><img loading="lazy" decoding="async"><button type="button">点击复制图片</button>';box.querySelector('strong').textContent=title;box.querySelector('span').textContent=date;const img=box.querySelector('img'),button=box.querySelector('button');img.alt=`${date} ${title}`;img.src=preview;button.dataset.copySrc=full;button.onclick=async()=>{const text=button.textContent,url=new URL(button.dataset.copySrc,location.href);url.searchParams.set('copy',String(Date.now()));button.dataset.copyState='copying';button.textContent='正在复制高清图…';button.disabled=true;try{if(!navigator.clipboard?.write||!window.ClipboardItem)throw Error('clipboard-image-unsupported');const pngPromise=fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('image-fetch-failed');return r.blob()}).then(async b=>b.type==='image/png'?b:new Blob([await b.arrayBuffer()],{type:'image/png'}));await navigator.clipboard.write([new ClipboardItem({'image/png':pngPromise})]);button.dataset.copyState='success';button.textContent='✓ 已复制高清图'}catch(e){button.dataset.copyState='failed';button.textContent='复制失败，请检查浏览器图片权限';button.title=e?.message||'copy failed'}setTimeout(()=>{button.disabled=false;button.textContent=text},3000)};cards.append(box)}}catch{document.getElementById('status').textContent='加载失败，请刷新';}})();
