<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>足球图片</title><style>

const cards=document.getElementById('cards');cards.textContent='';document.querySelector('.tip').textContent='11月15日全日方案；008胜平负/半全场未售。三张普通票不共场，所有回报按整套含本。';const a=document.createElement('a');a.href='info-2026-11-15-noon.html';a.textContent='查看11场完整审阅、反证与正式票';document.querySelector('.tip').after(a);
for(const item of items){const box=document.createElement('section');box.className='card';const full='cards/'+item.file,preview=full.replace('.png','-preview.jpg');box.innerHTML='<div class="head"><strong></strong><span></span></div><img loading="eager" decoding="async"><button type="button">点击复制图片</button><a target="_blank" rel="noopener">打开高清原图</a>';box.querySelector('strong').textContent=item.title;box.querySelector('span').textContent=item.date;const img=box.querySelector('img'),b=box.querySelector('button');img.alt=item.date+' '+item.title;img.src=preview;box.querySelector('a').href=full;b.dataset.copySrc=full;b.onclick=async()=>{b.disabled=true;b.dataset.copyState='copying';try{const blob=fetch(full+'?copy='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.blob()}).then(async b=>new Blob([await b.arrayBuffer()],{type:'image/png'}));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);b.dataset.copyState='success';b.textContent='✓ 已复制高清图'}catch(e){b.dataset.copyState='failed';b.textContent='复制失败，可打开原图保存';b.title=String(e)}b.disabled=false;};cards.append(box);}
</script></body></html>
