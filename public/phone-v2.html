<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>足球图片</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f1;color:#173d32;font-family:"Microsoft YaHei",sans-serif}main{max-width:720px;margin:auto;padding:12px}h1{margin:4px 0 6px;font-size:22px}.tip{margin:0 0 12px;color:#5d726a;font-size:13px}.card{margin-bottom:14px;padding:10px;background:#fff;border:1px solid #aac9bd;border-radius:6px}.head{display:flex;justify-content:space-between;margin-bottom:8px}.head strong{font-size:17px}.head span{font-size:12px;color:#667b73}img{display:block;width:100%;height:auto;border:1px solid #b7cec5;background:#e5eeeb}button{display:block;width:100%;margin-top:9px;padding:13px 8px;border:0;border-radius:5px;background:#197751;color:#fff;font-size:16px;font-weight:700}button:disabled{background:#829b92}#status{padding:30px;text-align:center}
</style></head><body><main><h1>足球四图</h1><p class="tip">点击绿色按钮，直接复制对应图片。</p><div id="cards"><div id="status">正在加载…</div></div></main><script>
(async()=>{const cards=document.getElementById('cards');try{const [today,review]=await Promise.all([fetch('data/latest.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/review-latest.json',{cache:'no-store'}).then(r=>r.json())]);const items=[['推荐扫盘',today.date,`${today.date}-final-scan.png`],['今日跟踪',today.date,`${today.date}-final-tracking.png`],['复盘扫盘',review.date,`${review.date}-review-scan.png`],['复盘跟踪',review.date,`${review.date}-review-tracking.png`]];cards.textContent='';for(const [title,date,file] of items){const box=document.createElement('section');box.className='card';const preview=`cards/${file.replace('.png','-preview.jpg')}?v=phone-v2`;box.innerHTML='<div class="head"><strong></strong><span></span></div><img decoding="async"><button disabled>图片准备中</button>';box.querySelector('strong').textContent=title;box.querySelector('span').textContent=date;const img=box.querySelector('img'),button=box.querySelector('button');img.alt=`${date} ${title}`;img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.getContext('2d').drawImage(img,0,0);canvas.toBlob(blob=>{img.copyBlob=blob;button.disabled=!blob;button.textContent=blob?'点击复制图片':'准备失败'},'image/png')};img.src=preview;button.onclick=async()=>{const text=button.textContent;try{if(!img.copyBlob||!navigator.clipboard?.write||!window.ClipboardItem)throw Error();await navigator.clipboard.write([new ClipboardItem({'image/png':img.copyBlob})]);button.textContent='✓ 已复制'}catch{button.textContent='浏览器未授权复制'}setTimeout(()=>button.textContent=text,2500)};cards.append(box)}}catch{document.getElementById('status').textContent='加载失败，请刷新';}})();
</script></body></html>
