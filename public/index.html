<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <title>竞彩足球扫盘</title>
  <style>
    :root{color-scheme:dark;--bg:#111315;--panel:#1a1d20;--line:#34393e;--text:#f4f5f6;--muted:#aeb5bc;--green:#58c797;--amber:#e4b85c;--red:#ef7777;--blue:#75b9e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Microsoft YaHei",sans-serif;letter-spacing:0}header{position:sticky;top:0;z-index:4;background:rgba(17,19,21,.96);border-bottom:1px solid var(--line)}.bar,main{width:min(1040px,100%);margin:auto}.bar{min-height:64px;padding:10px 16px;display:flex;align-items:center;gap:12px}h1{margin:0;font-size:20px;line-height:1.25}.subtitle{color:var(--muted);font-size:12px;margin-top:3px}button{margin-left:auto;width:42px;height:42px;border:1px solid var(--line);border-radius:6px;background:#202428;color:var(--text);font-size:23px;cursor:pointer}main{padding:18px 16px 44px}.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px}.status div{padding:13px 8px;min-width:0}.status div+div{border-left:1px solid var(--line)}.status small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.status strong{display:block;font-size:14px;overflow-wrap:anywhere}h2{font-size:17px;margin:26px 0 12px}.notice{padding:12px 0;color:var(--muted);line-height:1.65;border-bottom:1px solid var(--line)}.recommendation-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.recommendation-column{min-width:0}.recommendation-column>h3{font-size:14px;margin:0 0 8px;color:var(--muted)}.recommendations,.matches{display:grid;gap:10px}.dreams{margin-top:12px}.recommendation,.match{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px;min-width:0}.recommendation.strong{border-color:#685c3d}.recommendation h3,.match h3{margin:0;font-size:16px;overflow-wrap:anywhere}.recommendation .meta{color:var(--amber);margin-top:7px;font-weight:700;overflow-wrap:anywhere}.structure{color:var(--blue);font-size:12px;margin-top:5px}.legs{margin:10px 0 0;padding:0;list-style:none}.legs li{padding:7px 0;border-top:1px solid #2c3034;line-height:1.5;overflow-wrap:anywhere}.prediction{display:block;color:var(--green);font-size:11px;margin-top:3px}.match-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}.tag{color:var(--blue);font-size:12px;margin-bottom:5px}.kickoff{color:var(--muted);white-space:nowrap;font-size:12px}.markets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:13px}.market{min-width:0;border-top:1px solid var(--line);padding-top:10px}.market-title{color:var(--muted);font-size:12px;margin-bottom:7px}.odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.odd{text-align:center;background:#23272b;padding:7px 3px;border-radius:4px;min-width:0}.odd small{display:block;color:var(--muted);font-size:10px}.odd b{display:block;margin-top:2px;font-size:14px}.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--text)}.analysis{margin-top:11px;color:#d9dcdf;font-size:13px;line-height:1.65;overflow-wrap:anywhere}.empty{color:var(--muted);padding:20px 0}.error{color:var(--red)}footer{color:var(--muted);font-size:12px;line-height:1.65;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}@media(max-width:620px){main{padding-left:10px;padding-right:10px}.recommendation-groups{gap:8px}.recommendation{padding:10px}.recommendation h3{font-size:14px}.recommendation .meta,.legs,.analysis{font-size:12px}.markets{grid-template-columns:1fr}.status{grid-template-columns:1fr 1fr}.status div:last-child{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
  </style>
</head>
<body>
  <header><div class="bar"><div><h1>竞彩足球扫盘</h1><div class="subtitle">盘口快照 · 综合分析 · 串关方案</div></div><button id="refresh" title="刷新" aria-label="刷新">↻</button></div></header>
  <main>
    <section class="status" aria-label="监测状态"><div><small>在售日期</small><strong id="saleDate">读取中</strong></div><div><small>比赛数量</small><strong id="matchCount">--</strong></div><div><small>最近监测</small><strong id="checkedAt">--</strong></div></section>
    <h2>今日方案</h2><div id="summary" class="notice">正在读取综合扫盘结果。</div><div id="recommendations"></div>
    <h2>逐场盘口</h2><div id="matches" class="matches"><div class="empty">正在读取今日在售比赛。</div></div>
    <footer>普通胜平负与竞彩让球分开标注；“初次”是当天首次采集值，“当前”是最近采集值。页面只保存分析记录，不会自动投注，也不承诺赛果。</footer>
  </main>
  <script>
    const $=id=>document.getElementById(id),fmt=v=>Number.isFinite(Number(v))?Number(v).toFixed(2):'--';
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const time=v=>v?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v)):'--';
    function movement(first,current,key){const a=Number(first?.[key]),b=Number(current?.[key]);if(!Number.isFinite(a)||!Number.isFinite(b))return{cls:'flat',mark:''};return b>a?{cls:'up',mark:' ↑'}:b<a?{cls:'down',mark:' ↓'}:{cls:'flat',mark:''}}
    function market(title,first,current,labels){return `<div class="market"><div class="market-title">${esc(title)}</div><div class="odds">${labels.map(([key,label])=>{const m=movement(first,current,key);return `<div class="odd"><small>${label} · 初次 ${fmt(first?.[key])}</small><b class="${m.cls}">${fmt(current?.[key])}${m.mark}</b></div>`}).join('')}</div></div>`}
    function renderMatches(state,report){const day=state.days?.[state.currentDate],latest=day?.latest?.matches||[],first=day?.snapshots?.[0]?.matches||[];$('saleDate').textContent=state.currentDate||report.date||'--';$('matchCount').textContent=`${latest.length} 场`;$('checkedAt').textContent=time(state.checkedAt);if(!latest.length){$('matches').innerHTML='<div class="empty">当前没有读取到在售比赛。</div>';return}const notes=new Map((report.matchAnalysis||[]).map(x=>[String(x.number),x]));$('matches').innerHTML=latest.map(x=>{const opening=first.find(y=>y.id===x.id)||{},note=notes.get(String(x.number)),h=Number(x.handicap)>0?`主队受让${x.handicap}球`:`主队让${Math.abs(Number(x.handicap)||0)}球`;return `<article class="match"><div class="match-head"><div><div class="tag">${esc(x.number)} · ${esc(x.league)}</div><h3>${esc(x.home)} vs ${esc(x.away)}</h3></div><div class="kickoff">${time(x.kickoff)}</div></div><div class="markets">${market('普通胜平负',opening.spf,x.spf,[['win','主胜'],['draw','平'],['lose','客胜']])}${market(`竞彩让球 · ${h}`,opening.rqspf,x.rqspf,[['win','让胜'],['draw','让平'],['lose','让负']])}</div>${note?`<div class="analysis">${esc(note.text||note.summary||'')}</div>`:''}</article>`}).join('')}
    function recommendationCard(r){const structure=r.structureText||[r.passType,r.combinationCount?`${r.combinationCount}条组合`:null].filter(Boolean).join(' · ');return `<article class="recommendation ${r.category==='strong'?'strong':''}"><h3>${esc(r.name||r.type||'组合')}</h3><div class="meta">${esc(r.oddsText||r.totalOdds||'赔率待更新')}</div>${structure?`<div class="structure">${esc(structure)}</div>`:''}<ul class="legs">${(r.legs||[]).map(l=>{const prediction=[l.predictedScore?`预测 ${l.predictedScore}`:'',l.goalRange?`进球 ${l.goalRange}`:''].filter(Boolean).join(' · ');return `<li><strong>${esc(l.number||'')}</strong> ${esc(l.selection||'')} ${l.odds?`@ ${esc(l.odds)}`:''}${prediction?`<span class="prediction">${esc(prediction)}</span>`:''}</li>`}).join('')}</ul>${r.risk?`<div class="analysis">风险：${esc(r.risk)}</div>`:''}</article>`}
    function renderReport(report){$('summary').textContent=report.summary||'尚未发布今日综合方案。';const rows=report.recommendations||[],strong=rows.filter(r=>r.category==='strong'||/强烈建议/.test(r.name||r.type||'')),dream=rows.filter(r=>r.category==='dream'||/梦想/.test(r.name||r.type||'')),regular=rows.filter(r=>!strong.includes(r)&&!dream.includes(r));const empty='<div class="empty">暂未发布</div>';$('recommendations').innerHTML=`<div class="recommendation-groups"><section class="recommendation-column"><h3>常规串 · 最低2.8倍</h3><div class="recommendations">${regular.length?regular.map(recommendationCard).join(''):empty}</div></section><section class="recommendation-column"><h3>强烈建议 · 2.50–2.79倍</h3><div class="recommendations">${strong.length?strong.map(recommendationCard).join(''):empty}</div></section></div>${dream.length?`<section class="recommendation-column dreams"><h3>梦想串</h3><div class="recommendations">${dream.map(recommendationCard).join('')}</div></section>`:''}`}
    const DATA_ROOT='https://raw.githubusercontent.com/zdongdong8219-jpg/football-monitor/main/data/';
    async function load(){ $('refresh').disabled=true;try{const nonce=Date.now(),[s,r]=await Promise.all([fetch(`${DATA_ROOT}state.json?v=${nonce}`,{cache:'no-store'}),fetch(`${DATA_ROOT}latest.json?v=${nonce}`,{cache:'no-store'})]);if(!s.ok)throw Error('盘口数据暂时不可用');const state=await s.json(),report=r.ok?await r.json():{recommendations:[]};renderReport(report);renderMatches(state,report)}catch(e){$('matches').innerHTML=`<div class="empty error">${esc(e.message)}，请稍后刷新。</div>`}finally{$('refresh').disabled=false}}
    $('refresh').addEventListener('click',load);load();setInterval(load,5*60*1000);
  </script>
</body>
</html>
