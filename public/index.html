<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <title>掏空主任的裤衩子</title>
  <style>
    :root{color-scheme:dark;--bg:#111315;--panel:#1a1d20;--line:#34393e;--text:#f4f5f6;--muted:#aeb5bc;--green:#58c797;--amber:#e4b85c;--red:#ef7777;--blue:#75b9e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Microsoft YaHei",sans-serif;letter-spacing:0}header{position:sticky;top:0;z-index:4;background:rgba(17,19,21,.96);border-bottom:1px solid var(--line)}.bar,main{width:min(1040px,100%);margin:auto}.bar{min-height:64px;padding:10px 16px;display:flex;align-items:center;gap:12px}h1{margin:0;font-size:20px;line-height:1.25}.subtitle{color:var(--muted);font-size:12px;margin-top:3px}button{margin-left:auto;width:42px;height:42px;border:1px solid var(--line);border-radius:6px;background:#202428;color:var(--text);font-size:23px;cursor:pointer}button:disabled{opacity:.55;cursor:default}main{padding:18px 16px 44px}.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px}.status div{padding:13px 8px;min-width:0}.status div+div{border-left:1px solid var(--line)}.status small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.status strong{display:block;font-size:14px;overflow-wrap:anywhere}h2{font-size:17px;margin:26px 0 12px}.section-head{display:flex;align-items:center;gap:10px;margin:26px 0 12px}.section-head h2{margin:0}.copy-button{width:auto;height:36px;margin-left:auto;padding:0 12px;font-size:13px;font-weight:700;color:var(--amber)}.copy-button.copied{color:var(--green);border-color:#376b57}.notice{padding:12px 0;color:var(--muted);line-height:1.65;border-bottom:1px solid var(--line)}.recommendation-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.recommendation-column{min-width:0}.recommendation-column>h3{font-size:14px;margin:0 0 8px;color:var(--muted)}.recommendations,.matches{display:grid;gap:10px}.dreams{margin-top:12px}.recommendation,.match{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px;min-width:0}.recommendation.strong{border-color:#685c3d}.recommendation h3,.match h3{margin:0;font-size:16px;overflow-wrap:anywhere}.recommendation .meta{color:var(--amber);margin-top:7px;font-weight:700;overflow-wrap:anywhere}.structure{color:var(--blue);font-size:12px;margin-top:5px}.legs{margin:10px 0 0;padding:0;list-style:none}.legs li{padding:7px 0;border-top:1px solid #2c3034;line-height:1.5;overflow-wrap:anywhere}.prediction{display:block;color:var(--green);font-size:11px;margin-top:3px}.leg-reason{display:block;color:var(--muted);font-size:11px;margin-top:3px}.scan-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:7px;background:var(--panel)}.scan-table{width:100%;min-width:850px;border-collapse:collapse;font-size:13px}.scan-table th{padding:11px 9px;background:#292d30;color:#e9c779;text-align:left;white-space:nowrap}.scan-table td{padding:11px 9px;border-top:1px solid var(--line);vertical-align:middle}.scan-table tbody tr:nth-child(even){background:#171a1d}.scan-table .teams{font-weight:700}.scan-table .pick{color:var(--red);font-weight:800}.scan-table .pick.dream{color:var(--amber)}.scan-table .confidence{color:#ffd45c;white-space:nowrap}.scan-table .muted-pick{color:var(--muted)}.scan-note{margin:9px 2px 0;color:var(--muted);font-size:11px;line-height:1.55}.match-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}.tag{color:var(--blue);font-size:12px;margin-bottom:5px}.kickoff{color:var(--muted);white-space:nowrap;font-size:12px}.markets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:13px}.market{min-width:0;border-top:1px solid var(--line);padding-top:10px}.market-title{color:var(--muted);font-size:12px;margin-bottom:7px}.odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.odd{text-align:center;background:#23272b;padding:7px 3px;border-radius:4px;min-width:0}.odd small{display:block;color:var(--muted);font-size:10px}.odd b{display:block;margin-top:2px;font-size:14px}.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--text)}.analysis{margin-top:11px;color:#d9dcdf;font-size:13px;line-height:1.65;overflow-wrap:anywhere}.empty{color:var(--muted);padding:20px 0}.error{color:var(--red)}footer{color:var(--muted);font-size:12px;line-height:1.65;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}@media(max-width:620px){main{padding-left:10px;padding-right:10px}.recommendation-groups{gap:8px}.recommendation{padding:10px}.recommendation h3{font-size:14px}.recommendation .meta,.legs,.analysis{font-size:12px}.markets{grid-template-columns:1fr}.status{grid-template-columns:1fr 1fr}.status div:last-child{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.scan-wrap{margin-left:-10px;margin-right:-10px;border-radius:0;border-left:0;border-right:0}.scan-table{font-size:12px}.scan-table th,.scan-table td{padding:9px 7px}}
  </style>
</head>
<body>
  <header><div class="bar"><div><h1>掏空主任的裤衩子</h1><div class="subtitle">盘口快照 · 综合分析 · 串关方案</div></div><button id="refresh" title="刷新" aria-label="刷新">↻</button></div></header>
  <main>
    <section class="status" aria-label="监测状态"><div><small>在售日期</small><strong id="saleDate">读取中</strong></div><div><small>比赛数量</small><strong id="matchCount">--</strong></div><div><small>最近监测</small><strong id="checkedAt">--</strong></div></section>
    <h2>今日方案</h2><div id="summary" class="notice">正在读取综合扫盘结果。</div><div id="recommendations"></div>
    <div class="section-head"><h2>逐场扫盘表</h2><button id="copyScan" class="copy-button" type="button" title="复制逐场扫盘表" disabled>⧉ 复制</button></div><div id="scanTable"><div class="empty">正在整理逐场方向。</div></div>
    <h2>逐场盘口</h2><div id="matches" class="matches"><div class="empty">正在读取今日在售比赛。</div></div>
    <footer>普通胜平负、竞彩让球与半全场分开标注；“初次”是当天首次采集值，“当前”是最近采集值。页面只保存分析记录，不会自动投注，也不承诺赛果。</footer>
  </main>
  <script>
    const $=id=>document.getElementById(id),fmt=v=>Number.isFinite(Number(v))?Number(v).toFixed(2):'--';
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const time=v=>v?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v)):'--';
    function movement(first,current,key){const a=Number(first?.[key]),b=Number(current?.[key]);if(!Number.isFinite(a)||!Number.isFinite(b))return{cls:'flat',mark:''};return b>a?{cls:'up',mark:' ↑'}:b<a?{cls:'down',mark:' ↓'}:{cls:'flat',mark:''}}
    function market(title,first,current,labels){return `<div class="market"><div class="market-title">${esc(title)}</div><div class="odds">${labels.map(([key,label])=>{const m=movement(first,current,key);return `<div class="odd"><small>${label} · 初次 ${fmt(first?.[key])}</small><b class="${m.cls}">${fmt(current?.[key])}${m.mark}</b></div>`}).join('')}</div></div>`}
    function renderMatches(state,report){const day=state.days?.[state.currentDate],latest=day?.latest?.matches||[],first=day?.snapshots?.[0]?.matches||[];$('saleDate').textContent=state.currentDate||report.date||'--';$('matchCount').textContent=`${latest.length} 场`;$('checkedAt').textContent=time(state.checkedAt);if(!latest.length){$('matches').innerHTML='<div class="empty">当前没有读取到在售比赛。</div>';return}const notes=new Map((report.matchAnalysis||[]).map(x=>[String(x.number),x]));$('matches').innerHTML=latest.map(x=>{const opening=first.find(y=>y.id===x.id)||{},note=notes.get(String(x.number)),h=Number(x.handicap)>0?`主队受让${x.handicap}球`:`主队让${Math.abs(Number(x.handicap)||0)}球`;return `<article class="match"><div class="match-head"><div><div class="tag">${esc(x.number)} · ${esc(x.league)}</div><h3>${esc(x.home)} vs ${esc(x.away)}</h3></div><div class="kickoff">${time(x.kickoff)}</div></div><div class="markets">${market('普通胜平负',opening.spf,x.spf,[['win','主胜'],['draw','平'],['lose','客胜']])}${market(`竞彩让球 · ${h}`,opening.rqspf,x.rqspf,[['win','让胜'],['draw','让平'],['lose','让负']])}${market('半全场',opening.halfFull,x.halfFull,[['winWin','胜胜'],['winDraw','胜平'],['winLose','胜负'],['drawWin','平胜'],['drawDraw','平平'],['drawLose','平负'],['loseWin','负胜'],['loseDraw','负平'],['loseLose','负负']])}</div>${note?`<div class="analysis">${esc(note.text||note.summary||'')}</div>`:''}</article>`}).join('')}
    function recommendationCard(r){const structure=r.structureText||[r.passType,r.combinationCount?`${r.combinationCount}条组合`:null].filter(Boolean).join(' · ');return `<article class="recommendation ${r.category==='strong'?'strong':''}"><h3>${esc(r.name||r.type||'组合')}</h3><div class="meta">${esc(r.oddsText||r.totalOdds||'赔率待更新')}</div>${structure?`<div class="structure">${esc(structure)}</div>`:''}<ul class="legs">${(r.legs||[]).map(l=>{const prediction=[l.halfTimePrediction?`半场 ${l.halfTimePrediction}`:'',l.predictedScore?`全场 ${l.predictedScore}`:'',l.goalRange?`进球 ${l.goalRange}`:''].filter(Boolean).join(' · '),reason=[l.upgradeFrom?`由${l.upgradeFrom}升级`:'',l.selectionReason||''].filter(Boolean).join('：');return `<li><strong>${esc(l.number||'')}</strong> ${esc(l.selection||'')} ${l.odds?`@ ${esc(l.odds)}`:''}${prediction?`<span class="prediction">${esc(prediction)}</span>`:''}${reason?`<span class="leg-reason">${esc(reason)}</span>`:''}</li>`}).join('')}</ul>${r.risk?`<div class="analysis">风险：${esc(r.risk)}</div>`:''}</article>`}
    const yesterdayExample=[
      {number:'周四001',league:'芬超',teams:'赫尔辛基 vs 瓦萨',selection:'主胜',goals:'2–4球',halfFull:'平胜/胜胜',score:'2-1/3-1',stars:2},
      {number:'周四002',league:'芬超',teams:'库奥皮奥 vs AC奥卢',selection:'主胜',goals:'2–3球',halfFull:'平胜/胜胜',score:'2-0/2-1',stars:3},
      {number:'周四003',league:'巴甲',teams:'桑托斯 vs 弗拉门戈',selection:'普通客胜',goals:'2–4球',halfFull:'平负',score:'1-2/1-3',stars:4,recommended:true},
      {number:'周四004',league:'巴甲',teams:'巴竞技 vs 米竞技',selection:'竞彩让球(-1)让负',goals:'2–3球',halfFull:'平平/平负',score:'1-1/1-2',stars:4,recommended:true},
      {number:'周四005',league:'巴甲',teams:'弗鲁米嫩塞 vs 科里蒂巴',selection:'普通主胜 / 让胜',goals:'2–4球',halfFull:'平胜/胜胜',score:'2-0/3-1',stars:4,recommended:true},
      {number:'周四006',league:'巴甲',teams:'帕梅拉斯 vs 巴伊亚',selection:'让平/让负',goals:'2–3球',halfFull:'平平',score:'2-1/1-1',stars:2}
    ];
    function inferredScanRows(state,report){if(Array.isArray(report.scanTable)&&report.scanTable.length)return report.scanTable;if(report.date==='2026-10-08')return yesterdayExample;const matches=state.days?.[state.currentDate]?.latest?.matches||[],picks=new Map();for(const r of report.recommendations||[])for(const l of r.legs||[]){const key=String(l.number),old=picks.get(key)||{};picks.set(key,{...old,...l,recommended:true,dream:old.dream||r.category==='dream',stars:Math.max(old.stars||0,Number(l.confidenceStars)||Number(r.confidenceStars)||3)})}return matches.map(m=>{const p=picks.get(String(m.number))||{};return{number:m.number,league:m.league,teams:`${m.home} vs ${m.away}`,selection:p.selection||'观察',goals:p.goalRange||'--',halfFull:p.halfTimePrediction||'--',score:p.predictedScore||'--',stars:p.stars||0,recommended:!!p.recommended,dream:!!p.dream}})}
    let currentScanRows=[],currentScanDate='';
    function renderScanTable(state,report){const rows=inferredScanRows(state,report);currentScanRows=rows;currentScanDate=state.currentDate||report.date||'';$('copyScan').disabled=!rows.length;if(!rows.length){$('scanTable').innerHTML='<div class="empty">暂无逐场扫盘结论。</div>';return}$('scanTable').innerHTML=`<div class="scan-wrap"><table class="scan-table"><thead><tr><th>编号</th><th>赛事</th><th>对阵</th><th>推荐方向</th><th>总进球</th><th>半全场</th><th>比分</th><th>稳健度</th></tr></thead><tbody>${rows.map(x=>{const stars=Math.max(0,Math.min(5,Number(x.stars)||0)),pickClass=x.recommended?(x.dream?'pick dream':'pick'):'muted-pick';return `<tr><td>${esc(x.number)}</td><td>${esc(x.league||'--')}</td><td class="teams">${esc(x.teams||[x.home,x.away].filter(Boolean).join(' vs '))}</td><td class="${pickClass}">${esc(x.selection||'观察')}</td><td>${esc(x.goals||x.goalRange||'--')}</td><td>${esc(x.halfFull||x.halfTimePrediction||'--')}</td><td>${esc(x.score||x.predictedScore||'--')}</td><td class="confidence" aria-label="${stars}星">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</td></tr>`}).join('')}</tbody></table></div><div class="scan-note">红色为常规/强烈建议串关采用方向，金色为梦想串采用方向；星级最高5颗，仅表示模型相对信心，不代表保证命中。</div>`}
    function scanText(){const header=[`掏空主任的裤衩子 · ${currentScanDate}`,'编号｜赛事｜对阵｜推荐方向｜总进球｜半全场｜比分｜稳健度'];const rows=currentScanRows.map(x=>{const stars=Math.max(0,Math.min(5,Number(x.stars)||0)),teams=x.teams||[x.home,x.away].filter(Boolean).join(' vs ');return [x.number,x.league||'--',teams,x.selection||'观察',x.goals||x.goalRange||'--',x.halfFull||x.halfTimePrediction||'--',x.score||x.predictedScore||'--',`${'★'.repeat(stars)}${'☆'.repeat(5-stars)}`].join('｜')});return [...header,...rows,'仅供参考，理性购彩'].join('\n')}
    async function copyScanTable(){if(!currentScanRows.length)return;const text=scanText();try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);else{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();if(!document.execCommand('copy'))throw Error('copy failed');area.remove()}const button=$('copyScan');button.textContent='✓ 已复制';button.classList.add('copied');setTimeout(()=>{button.textContent='⧉ 复制';button.classList.remove('copied')},1800)}catch{$('copyScan').textContent='复制失败'}}
    function renderReport(report){$('summary').textContent=report.summary||'尚未发布今日综合方案。';const rows=report.recommendations||[],strong=rows.filter(r=>r.category==='strong'||/强烈建议/.test(r.name||r.type||'')),dream=rows.filter(r=>r.category==='dream'||/梦想/.test(r.name||r.type||'')),regular=rows.filter(r=>!strong.includes(r)&&!dream.includes(r));const empty='<div class="empty">暂未发布</div>';$('recommendations').innerHTML=`<div class="recommendation-groups"><section class="recommendation-column"><h3>常规串 · 最低2.8倍</h3><div class="recommendations">${regular.length?regular.map(recommendationCard).join(''):empty}</div></section><section class="recommendation-column"><h3>强烈建议 · 2.50–2.79倍</h3><div class="recommendations">${strong.length?strong.map(recommendationCard).join(''):empty}</div></section></div>${dream.length?`<section class="recommendation-column dreams"><h3>梦想串</h3><div class="recommendations">${dream.map(recommendationCard).join('')}</div></section>`:''}`}
    const DATA_ROOT='https://raw.githubusercontent.com/zdongdong8219-jpg/football-monitor/main/data/';
    async function load(){ $('refresh').disabled=true;try{const nonce=Date.now(),[s,r]=await Promise.all([fetch(`${DATA_ROOT}state.json?v=${nonce}`,{cache:'no-store'}),fetch(`${DATA_ROOT}latest.json?v=${nonce}`,{cache:'no-store'})]);if(!s.ok)throw Error('盘口数据暂时不可用');const state=await s.json(),report=r.ok?await r.json():{recommendations:[]};renderReport(report);renderScanTable(state,report);renderMatches(state,report)}catch(e){$('scanTable').innerHTML=`<div class="empty error">${esc(e.message)}，请稍后刷新。</div>`;$('matches').innerHTML=`<div class="empty error">${esc(e.message)}，请稍后刷新。</div>`}finally{$('refresh').disabled=false}}
    $('refresh').addEventListener('click',load);$('copyScan').addEventListener('click',copyScanTable);load();setInterval(load,5*60*1000);
  </script>
</body>
</html>
