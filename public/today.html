</style></head><body><main><h1>2026-10-24 · 早中场合并</h1><p>早场5场原审核锁定保留；中场13场已审，核心2.0：016胜×009胜，整套1.72倍。中场3.0不凑；晚场待追加。</p><p>北京时间 2026/10/24 10:49:30 · 2.0：中场016胜×009胜，整套1.72倍；3.0：中场其余候选未达门槛，晚场继续筛选</p><p>原票按批锁定，后续只追加。保存可下载原图或长按；复制为独立按钮。</p><section class="card" data-file="audits/2026-10-24-B-20261024T024930974Z-poster.png" data-name="FT足球-2026-10-24-poster.png"><h2>推荐扫盘图</h2><div class="actions"><button class="copy">复制图片</button><button class="share">保存／分享</button><a class="action" href="audits/2026-10-24-B-20261024T024930974Z-poster.png" download="FT足球-2026-10-24-poster.png">下载原图</a><a class="action" href="audits/2026-10-24-B-20261024T024930974Z-poster.png">打开原图</a></div><a href="audits/2026-10-24-B-20261024T024930974Z-poster.png"><img loading="eager" src="mobile/2026-10-24-B-20261024T024930974Z-poster.jpg" alt="推荐扫盘图"></a><p class="status" role="status"></p></section><section class="card" data-file="audits/2026-10-24-B-20261024T024930974Z-tracking.png" data-name="FT足球-2026-10-24-tracking.png"><h2>2.0／3.0跟踪卡</h2><div class="actions"><button class="copy">复制图片</button><button class="share">保存／分享</button><a class="action" href="audits/2026-10-24-B-20261024T024930974Z-tracking.png" download="FT足球-2026-10-24-tracking.png">下载原图</a><a class="action" href="audits/2026-10-24-B-20261024T024930974Z-tracking.png">打开原图</a></div><a href="audits/2026-10-24-B-20261024T024930974Z-tracking.png"><img loading="eager" src="mobile/2026-10-24-B-20261024T024930974Z-tracking.jpg" alt="2.0／3.0跟踪卡"></a><p class="status" role="status"></p></section><p><a href="audits/2026-10-24-B-20261024T024930974Z.json">本版JSON和逐腿依据</a></p><p>不可变批次档案：<a href="audits/2026-10-24-A-20261024T023922719Z.json">早场</a> · <a href="audits/2026-10-24-B-20261024T024930974Z.json">中场</a></p><a class="full" href="index.html?full=1">完整盘口主站</a></main><script>for(const card of document.querySelectorAll('.card')){const url=new URL(card.dataset.file,location.href).href,status=card.querySelector('.status');card.querySelector('.copy').onclick=async()=>{try{status.textContent='正在复制…';if(!navigator.clipboard?.write||!window.ClipboardItem)throw Error('unsupported');const blobPromise=fetch(url).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.blob()});await navigator.clipboard.write([new ClipboardItem({'image/png':blobPromise})]);status.textContent='图片已复制'}catch(e){status.textContent='此浏览器不支持复制，请点下载原图或打开后长按保存'}};card.querySelector('.share').onclick=async()=>{try{status.textContent='正在准备原图…';const response=await fetch(url);if(!response.ok)throw Error('HTTP '+response.status);const blob=await response.blob(),file=new File([blob],card.dataset.name,{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'足球分段方案'});status.textContent='分享操作已返回；请确认系统保存结果'}else{const a=document.createElement('a');a.href=url;a.download=card.dataset.name;document.body.append(a);a.click();a.remove();status.textContent='已请求下载；也可打开原图后长按保存'}}catch(e){status.textContent=e.name==='AbortError'?'已取消分享，可下载原图保存':'分享未完成，请下载或打开原图'}}};</script></body></html>
