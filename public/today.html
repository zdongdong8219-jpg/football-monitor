<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2148">
<title>今日足球推荐图片</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07152d;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif}main{width:min(720px,100%);margin:auto;padding:12px 10px 40px}h1{font-size:20px;margin:4px 0 6px}p{margin:0 0 12px;color:#bdcbe0;font-size:13px;line-height:1.5}.card{margin:12px 0 20px;padding:10px;background:#102650;border:1px solid #7694bb;border-radius:6px}.card h2{font-size:16px;margin:0 0 9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}button,a.action{min-height:44px;display:grid;place-items:center;border:1px solid #e7c978;border-radius:5px;background:#24548a;color:#fff;font-size:15px;font-weight:700;text-decoration:none}img{display:block;width:100%;height:auto;border:1px solid #e7c978;background:#0d2148}.status{min-height:22px;margin:8px 0 0;color:#ffe09b;font-size:13px}.full{display:block;margin-top:20px;color:#9bc9ff;text-align:center}
</style>
</head>
<body><main>
<h1>2026-10-23 今日推荐图片</h1>
<p>轻量版只加载两张压缩图。点“保存／分享”调用手机系统；也可点图片打开原图后长按保存。</p>
<section class="card" data-file="audits/2026-10-23-selected-win-20261023T083732625Z-poster.png" data-name="2026-10-23-推荐扫盘.png"><h2>推荐＋12场扫盘</h2><div class="actions"><button type="button" class="share">保存／分享</button><a class="action original" href="audits/2026-10-23-selected-win-20261023T083732625Z-poster.png" download="2026-10-23-推荐扫盘.png">下载／打开原图</a></div><a href="audits/2026-10-23-selected-win-20261023T083732625Z-poster.png"><img src="mobile/2026-10-23-poster.jpg" alt="推荐和12场扫盘" loading="eager" fetchpriority="high"></a><div class="status" role="status"></div></section>
<section class="card" data-file="audits/2026-10-23-selected-win-20261023T083732625Z-tracking.png" data-name="2026-10-23-跟踪卡.png"><h2>2.0／3.0跟踪卡</h2><div class="actions"><button type="button" class="share">保存／分享</button><a class="action original" href="audits/2026-10-23-selected-win-20261023T083732625Z-tracking.png" download="2026-10-23-跟踪卡.png">下载／打开原图</a></div><a href="audits/2026-10-23-selected-win-20261023T083732625Z-tracking.png"><img src="mobile/2026-10-23-tracking.jpg" alt="2.0和3.0跟踪卡" loading="eager"></a><div class="status" role="status"></div></section>
<a class="full" href="?full=1">进入完整盘口页面</a>
</main><script>
for(const card of document.querySelectorAll('.card'))card.querySelector('.share').onclick=async()=>{
 const button=card.querySelector('.share'),status=card.querySelector('.status'),url=new URL(card.dataset.file,location.href).href;
 button.disabled=true;status.textContent='正在准备原图…';
 try{
  const response=await fetch(url);if(!response.ok)throw Error('HTTP '+response.status);
  const blob=await response.blob(),file=new File([blob],card.dataset.name,{type:'image/png'});
  if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({files:[file],title:'FT足球竞彩模型'});status.textContent='已打开手机分享面板';}
  else if(navigator.clipboard?.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);status.textContent='图片已复制';}
  else{const a=document.createElement('a');a.href=url;a.download=card.dataset.name;document.body.append(a);a.click();a.remove();status.textContent='已下载原图；若浏览器打开图片，请长按保存';}
 }catch(e){if(e.name!=='AbortError'){location.href=url;status.textContent='已打开原图，请长按保存';}}
 finally{button.disabled=false}
};
</script></body></html>
