name: Monitor football odds
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/latest.json'
      - 'data/state-latest.json'
      - 'data/review-latest.json'
      - 'data/reports/**'
      - 'public/**'
      - 'scripts/**'
      - 'data/workflow-legacy-tracking.json'
      - 'data/review-template-lock.json'
      - 'data/tracking-hit-style-lock.json'
      - 'RECOMMENDATION-RULES.md'
      - '.github/workflows/monitor.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: football-monitor
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: github.event_name == 'schedule'
        run: node scripts/collect.mjs
      - run: node scripts/check-build.mjs
      - run: node scripts/test-delivery-workflow.mjs
      - run: node scripts/test-dream-three.mjs
      - run: node scripts/test-tracking-hit-style.mjs
      - if: github.event_name == 'schedule'
        name: Save monitoring snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/state.json data/research
          git diff --cached --quiet || git commit -m "Update football monitoring snapshot"
          git push
      - run: mkdir -p _site/data && cp -r public/. _site/ && cp data/state.json data/state-latest.json data/latest.json data/review-latest.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
